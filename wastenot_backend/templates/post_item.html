{% extends 'base.html' %}
{% load static %}

{% block title %}Post an Item - WasteNot{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-xl p-6">
        <h1 class="text-3xl font-bold mb-6">Post an Item</h1>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="title" class="block text-gray-700 font-bold mb-2">Title</label>
                <input type="text" id="title" name="title" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            
            <div class="mb-4">
                <label for="description" class="block text-gray-700 font-bold mb-2">Description</label>
                <textarea id="description" name="description" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"
                    rows="4"></textarea>
            </div>
            
            <div class="mb-4">
                <label for="location" class="block text-gray-700 font-bold mb-2">Location</label>
                <input type="text" id="location" name="location" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
            
            <div class="mb-4">
                <label for="category" class="block text-gray-700 font-bold mb-2">Category</label>
                <select id="category" name="category" required
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="">Select a category</option>
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- In the form, ensure the file input allows multiple files -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="images">
                    Images (the first image will be analyzed for condition)
                </label>
                <input type="file" id="images" name="images" accept="image/*" multiple required
                       class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <div id="condition-analysis" class="mt-2 text-sm text-green-700"></div>
                <p class="text-gray-600 text-xs italic">
                    Upload one or more images. The first image will be analyzed for condition and used as the primary image.
                </p>
            </div>

            <!-- Only one hidden input for condition -->
            <input type="hidden" id="condition" name="condition" value="Unknown">
            
            
            <button type="submit" class="w-full bg-green-500 text-white py-2 px-4 rounded-lg hover:bg-green-600 transition-colors duration-300">
                Post Item
            </button>
        </form>
    </div>
</div>

<!-- Centered and styled location button -->
<div class="flex justify-center mb-4">
    <button type="button" id="locate-btn" class="flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-full shadow-md transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-offset-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c.552 0 1 .448 1 1s-.448 1-1 1-1-.448-1-1 .448-1 1-1zm0 8c-4.418 0-8-3.582-8-8s3.582-8 8-8 8 3.582 8 8-3.582 8-8 8zm0-14v2m0 12v2m8-8h-2M4 12H2" />
        </svg>
        Use My Current Location
    </button>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Map Container -->
<div id="map" style="height: 300px;"></div>

<!-- Hidden fields in your form -->
<input type="hidden" id="id_latitude" name="latitude">
<input type="hidden" id="id_longitude" name="longitude">

<script>
    var map = L.map('map').setView([20.5937, 78.9629], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    var marker;

    // Map click to set marker
    map.on('click', function(e) {
        setMarker(e.latlng.lat, e.latlng.lng);
    });

    // Use My Location button
    document.getElementById('locate-btn').onclick = function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var lat = position.coords.latitude;
                var lng = position.coords.longitude;
                map.setView([lat, lng], 15);
                setMarker(lat, lng);
            }, function(error) {
                alert('Unable to retrieve your location.');
            });
        } else {
            alert('Geolocation is not supported by your browser.');
        }
    };

    function setMarker(lat, lng) {
        if (marker) {
            marker.setLatLng([lat, lng]);
        } else {
            marker = L.marker([lat, lng]).addTo(map);
        }
        document.getElementById('id_latitude').value = lat;
        document.getElementById('id_longitude').value = lng;
        fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)
        .then(response => response.json())
        .then(data => {
            if (data.display_name) {
                document.getElementById('location').value = data.display_name;
            } else {
                document.getElementById('location').value = '';
            }
        })
        .catch(() => {
            document.getElementById('location').value = '';
        });
    }
</script>


<input type="hidden" id="condition" name="condition" value="Fair">
<script>
    // Analyze the first image selected in the unified images input
    document.getElementById('images').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('image', file);

        document.getElementById('condition-analysis').innerText = 'Analyzing image...';

        fetch('/api/analyze-condition/', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.condition) {
                document.getElementById('condition-analysis').innerHTML =
                    `<b>Detected Condition:</b> ${data.condition}<br>
                     <b>Labels:</b> ${data.labels.map(l => l.description).join(', ')}`;
                document.getElementById('condition').value = data.condition;
            } else {
                document.getElementById('condition-analysis').innerText = 'Could not analyze image.';
                document.getElementById('condition').value = 'Unknown';
            }
        })
        .catch(() => {
            document.getElementById('condition-analysis').innerText = 'Error analyzing image.';
            document.getElementById('condition').value = 'Unknown';
        });
    });
</script>
{% endblock %}
