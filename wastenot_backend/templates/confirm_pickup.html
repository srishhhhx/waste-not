{% extends 'base.html' %}
{% load static %}

{% block main_content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">Confirm Pickup</h1>
            <div class="mb-6">
                <h2 class="text-xl font-semibold">{{ item.title }}</h2>
                <p class="text-gray-600">{{ item.description|truncatewords:20 }}</p>
                
                {% if item.images.exists %}
                <div class="mt-4">
                    <img src="{{ item.images.first.image.url }}" alt="{{ item.title }}" class="w-full h-48 object-cover rounded">
                </div>
                {% endif %}
            </div>
            
            <form method="post" action="">
                {% csrf_token %}
                <p class="text-gray-600 mb-6">
                    By confirming pickup, you acknowledge that you have received this item.
                </p>
                
                <div class="flex justify-between">
                    <a href="{% url 'dashboard' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded">
                        Cancel
                    </a>
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                        Confirm Pickup
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
