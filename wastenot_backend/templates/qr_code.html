{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-6">
        <h2 class="text-2xl font-bold mb-6 text-center">QR Code for {{ item.title }}</h2>
        
        <div class="flex justify-center mb-6">
            <img src="{{ item.qr_code.url }}" alt="QR Code" class="w-64 h-64">
        </div>
        
        <p class="text-center text-gray-700 mb-6">
            When the recipient arrives to pick up this item, they can scan this QR code to confirm the pickup.
        </p>
        
        <div class="text-center">
            <p class="font-semibold mb-2">Pickup Code:</p>
            <p class="bg-gray-100 p-2 rounded">{{ item.pickup_code }}</p>
        </div>
        
        <div class="mt-8 text-center">
            <a href="{% url 'item_detail' item.id %}" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">
                Back to Item
            </a>
        </div>
    </div>
</div>
{% endblock %}
