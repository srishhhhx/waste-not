{% extends 'base.html' %}
{% load static %}

{% block main_content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white shadow-lg rounded-lg overflow-hidden">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">QR Code for {{ item.title }}</h1>
            <p class="text-gray-600 mb-6">
                Have the recipient scan this QR code to confirm pickup of the item.
            </p>
            
            <div class="flex justify-center mb-6">
                <img src="{{ item.qr_code.url }}" alt="QR Code" class="w-64 h-64">
            </div>
            
            <div class="text-center">
                <p class="text-sm text-gray-500 mb-4">Pickup Code: {{ item.pickup_code }}</p>
                <a href="{% url 'item_detail' item.id %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded">
                    Back to Item
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
